name: Android CI/CD Release

on:
  push:
    branches:
      - master

# 🔑 Permission requise pour créer une Release GitHub et charger les fichiers
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4
        with:
          ref: master

      - name: ☕ Configurer le JDK (Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: 🔑 Rendre Gradle exécutable
        run: chmod +x gradlew

      # Auto-incrémenter la version dans app/build.gradle.kts et committer avec [skip ci]
      - name: 🔢 Auto-incrémenter la version
        run: |
          chmod +x scripts/bump-version.sh
          ./scripts/bump-version.sh
          
          NEW_CODE=$(awk -F'=' '/val appVersionCode/{gsub(/[^0-9]/, "", $2); print $2}' app/build.gradle.kts)
          NEW_NAME="1.0.${NEW_CODE}"
          
          echo "APP_VERSION_NAME=${NEW_NAME}" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=${NEW_CODE}" >> $GITHUB_ENV
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore(release): bump version to ${NEW_NAME} (code ${NEW_CODE}) [skip ci]"
          git push origin master

      # 1. Restauration du Keystore à partir du secret Base64
      - name: 🔓 Restaurer le Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > app/release-key.jks

      # 2. Restaurer le google-services.json
      - name: 🔓 Restaurer Google Services JSON
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json

      - name: 🧪 Lancer les tests unitaires
        run: ./gradlew testDebugUnitTest

      # 3. Compilation de l'APK Release (avec ajustement de la mémoire JVM)
      - name: 📦 Compiler l'APK Release Signé
        env:
          KEYSTORE_FILE: "release-key.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: ./gradlew assembleRelease --no-daemon

      # 4. Publication de l'APK sur GitHub Releases
      - name: 🚀 Publier sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: "Release v${{ env.APP_VERSION_NAME }}"
          body: "APK de release signé généré automatiquement suite au push sur master."
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}