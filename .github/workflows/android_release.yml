name: CI/CD Release (Android & Desktop Multiplatform)

on:
  push:
    branches:
      - master

# 🔑 Permission requise pour créer une Release GitHub et charger les fichiers
permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. Préparation de la release (bump de version, changelog, commit & tag)
  # =========================================================================
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}

    steps:
      - name: 📥 Cloner le dépôt (historique complet et tags)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: 🏷️ Déterminer le tag précédent
        id: previous_tag
        run: |
          git fetch --tags --force
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=${PREV_TAG}" >> $GITHUB_OUTPUT
          echo "Previous tag: ${PREV_TAG:-<none>}"

      # Auto-incrémenter la version dans app/build.gradle.kts
      - name: 🔢 Auto-incrémenter la version
        id: version
        run: |
          chmod +x scripts/bump-version.sh
          ./scripts/bump-version.sh

          NEW_CODE=$(awk -F'=' '/val appVersionCode/{gsub(/[^0-9]/, "", $2); print $2}' app/build.gradle.kts)
          NEW_NAME="1.0.${NEW_CODE}"

          echo "version_name=${NEW_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${NEW_CODE}" >> $GITHUB_OUTPUT
          echo "APP_VERSION_NAME=${NEW_NAME}" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=${NEW_CODE}" >> $GITHUB_ENV

      - name: 🛠️ Installer git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: 📝 Générer le changelog
        run: |
          CURRENT_TAG="v${APP_VERSION_NAME}"
          PREV_TAG="${{ steps.previous_tag.outputs.tag }}"

          if [ -z "$PREV_TAG" ]; then
            git-cliff --config .cliff.toml --tag "$CURRENT_TAG" --unreleased --output CHANGELOG.md
          else
            git-cliff --config .cliff.toml --tag "$CURRENT_TAG" "${PREV_TAG}..HEAD" --output CHANGELOG.md
          fi

          if [ ! -s CHANGELOG.md ] || [ -z "$(grep -v '^[[:space:]]*$' CHANGELOG.md)" ]; then
            echo "No changes since ${PREV_TAG:-previous release}." > CHANGELOG.md
          fi

          echo "Generated changelog for ${CURRENT_TAG} (since ${PREV_TAG:-beginning}):"
          cat CHANGELOG.md

      - name: 💾 Committer et pousser la nouvelle version et son tag
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore(release): bump version to ${APP_VERSION_NAME} (code ${APP_VERSION_CODE}) [skip ci]"
          git tag "v${APP_VERSION_NAME}"
          git push origin master --tags
          echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: 📤 Sauvegarder le changelog en artefact
        uses: actions/upload-artifact@v4
        with:
          name: release-changelog
          path: CHANGELOG.md

  # =========================================================================
  # 2. Compilation et tests de l'application Android
  # =========================================================================
  build-android:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Cloner le dépôt au commit de version
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
          fetch-depth: 0

      - name: ☕ Configurer le JDK (Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: 🔑 Rendre Gradle exécutable
        run: chmod +x gradlew

      - name: 🔓 Restaurer le Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > app/release-key.jks

      - name: 🧪 Lancer les tests unitaires (Android & Desktop KMP)
        run: ./gradlew testDebugUnitTest :core:desktopTest :data:desktopTest :app:desktopTest

      - name: 📦 Compiler l'APK Release Signé
        env:
          KEYSTORE_PATH: "release-key.jks"
          KEYSTORE_FILE: "release-key.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: ./gradlew assembleRelease --no-daemon

      - name: 🏷️ Préparer et normaliser l'artefact Android
        run: |
          mkdir -p dist-android
          cp app/build/outputs/apk/release/*.apk dist-android/droidplane-${{ needs.prepare-release.outputs.version_name }}.apk
          echo "### Android Artifacts" >> $GITHUB_STEP_SUMMARY
          ls -lh dist-android/ >> $GITHUB_STEP_SUMMARY

      - name: 📤 Téléverser l'APK Android
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist-android/*.apk

  # =========================================================================
  # 3. Compilation des distributions Desktop (Linux & Windows)
  # =========================================================================
  build-desktop:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            gradle_task: ":app:packageDeb :app:createDistributable"
            artifact_name: "release-desktop-linux"
            artifact_path: "app/build/compose/binaries/main/deb/*.deb"
          - os: windows-latest
            platform: windows
            gradle_task: ":app:packageMsi"
            artifact_name: "release-desktop-windows"
            artifact_path: "app/build/compose/binaries/main/msi/*.msi"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: 📥 Cloner le dépôt au commit de version
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
          fetch-depth: 0

      - name: 🛠️ Compiler et téléverser (${{ matrix.platform }})
        uses: ./.github/actions/build-desktop
        with:
          platform: ${{ matrix.platform }}
          gradle_task: ${{ matrix.gradle_task }}
          artifact_name: ${{ matrix.artifact_name }}
          artifact_path: ${{ matrix.artifact_path }}
          version_name: ${{ needs.prepare-release.outputs.version_name }}

  # =========================================================================
  # 4. Compilation macOS (arm64 par défaut, avec repli Intel si indisponible)
  # =========================================================================
  build-desktop-macos:
    needs: prepare-release
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Cloner le dépôt au commit de version
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
          fetch-depth: 0

      - name: 🛠️ Compiler et téléverser (macos arm64)
        uses: ./.github/actions/build-desktop
        with:
          platform: "macos"
          gradle_task: ":app:packageDmg"
          artifact_name: "release-desktop-macos"
          artifact_path: "app/build/compose/binaries/main/dmg/*.dmg"
          version_name: ${{ needs.prepare-release.outputs.version_name }}

  build-desktop-macos-fallback:
    needs: [prepare-release, build-desktop-macos]
    if: ${{ always() && needs.prepare-release.result == 'success' && (needs.build-desktop-macos.result == 'failure' || needs.build-desktop-macos.result == 'cancelled') }}
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: 📥 Cloner le dépôt au commit de version
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
          fetch-depth: 0

      - name: 🛠️ Compiler et téléverser (macos intel fallback)
        uses: ./.github/actions/build-desktop
        with:
          platform: "macos"
          gradle_task: ":app:packageDmg"
          artifact_name: "release-desktop-macos"
          artifact_path: "app/build/compose/binaries/main/dmg/*.dmg"
          version_name: ${{ needs.prepare-release.outputs.version_name }}

  # =========================================================================
  # 5. Publication non bloquante sur GitHub Releases des plateformes réussies
  # =========================================================================
  publish-release:
    needs: [prepare-release, build-android, build-desktop, build-desktop-macos, build-desktop-macos-fallback]
    if: ${{ always() && needs.prepare-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Télécharger les artefacts disponibles de la release
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: 🗂️ Rassembler les actifs disponibles et vérifier les plateformes
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -type f \( -name "*.apk" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.dmg" \) -exec cp {} release-assets/ \;

          if [ -f downloaded-artifacts/release-changelog/CHANGELOG.md ]; then
            cp downloaded-artifacts/release-changelog/CHANGELOG.md ./CHANGELOG.md
          else
            echo "Release v${{ needs.prepare-release.outputs.version_name }}" > ./CHANGELOG.md
          fi

          missing_platforms=()
          has_asset() {
            find release-assets -maxdepth 1 -type f -name "$1" | grep -q .
          }

          if ! has_asset "*.apk"; then
            missing_platforms+=("Android (.apk)")
          fi
          if ! has_asset "*.deb" && ! has_asset "*.AppImage"; then
            missing_platforms+=("Linux (.deb / .AppImage)")
          fi
          if ! has_asset "*.msi"; then
            missing_platforms+=("Windows (.msi)")
          fi
          if ! has_asset "*.dmg"; then
            missing_platforms+=("macOS (.dmg)")
          fi

          echo "### Publication Récapitulative des Actifs" >> "$GITHUB_STEP_SUMMARY"
          echo "Release tag : v${{ needs.prepare-release.outputs.version_name }}" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::Aucun artefact compilé n'est disponible ; publication annulée."
            echo "Aucun actif disponible." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          ls -lh release-assets/ | tee -a "$GITHUB_STEP_SUMMARY"

          if [ ${#missing_platforms[@]} -gt 0 ]; then
            missing_list="$(printf '%s, ' "${missing_platforms[@]}")"
            missing_list="${missing_list%, }"
            echo "::warning::Release partielle — plateformes manquantes : ${missing_list}"
            {
              echo ""
              echo "---"
              echo "> **Note :** Certains builds ont échoué sur ce cycle CI. Plateformes non incluses : ${missing_list}."
            } >> ./CHANGELOG.md
            echo "⚠️ Plateformes manquantes : ${missing_list}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 🚀 Publier sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-release.outputs.version_name }}
          name: "Release v${{ needs.prepare-release.outputs.version_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
