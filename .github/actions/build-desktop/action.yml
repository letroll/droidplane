name: 'Build and Upload Desktop Distribution'
description: 'Build native Desktop binaries for Linux, Windows, or macOS and upload them as a workflow artifact'

inputs:
  platform:
    description: 'Target desktop platform (linux, windows, macos)'
    required: true
  gradle_task:
    description: 'Gradle task(s) to run'
    required: true
  artifact_name:
    description: 'Name of the uploaded workflow artifact'
    required: true
  artifact_path:
    description: 'Glob path for generated binary on windows/macos'
    required: false
    default: ''
  version_name:
    description: 'Application version name (used for AppImage packaging on Linux)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: ☕ Configurer le JDK (Java 21)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: gradle

    - name: 🔑 Rendre Gradle exécutable
      shell: bash
      run: chmod +x gradlew

    - name: 📦 Compiler la distribution native (${{ inputs.platform }})
      shell: bash
      run: |
        if [ "${{ inputs.platform }}" = "linux" ]; then
          chmod +x scripts/package-appimage.sh
          ./gradlew ${{ inputs.gradle_task }} --no-daemon
          ./scripts/package-appimage.sh --version "${{ inputs.version_name }}"
        else
          ./gradlew ${{ inputs.gradle_task }} --no-daemon
        fi

    - name: 🏷️ Préparer et normaliser l'artefact Desktop (${{ inputs.platform }})
      shell: bash
      run: |
        mkdir -p dist-desktop
        if [ "${{ inputs.platform }}" = "linux" ]; then
          cp app/build/compose/binaries/main/deb/*.deb dist-desktop/
          cp app/build/compose/binaries/main/appimage/*.AppImage dist-desktop/
        else
          cp ${{ inputs.artifact_path }} dist-desktop/
        fi
        echo "### Desktop Artifact (${{ inputs.platform }})" >> "$GITHUB_STEP_SUMMARY"
        ls -lh dist-desktop/ >> "$GITHUB_STEP_SUMMARY"

    - name: 📤 Téléverser l'artefact Desktop (${{ inputs.platform }})
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: dist-desktop/*
        overwrite: true
