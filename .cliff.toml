# git cliff configuration for Droidplane
# Generates changelog from conventional commits

[changelog]
# Header for the changelog
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n\nThe format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),\nand this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n"

# Template for the changelog body
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }}){% if commit.scope %} **{{ commit.scope }}**{% endif %}
{% endfor %}
{% endfor %}
"""

# Footer
footer = "\n---\n*Generated by [git cliff](https://github.com/orhun/git-cliff)*\n"

# Sort commits by date (newest first)
sort = "oldest"

[git]
# Conventional commit types and their grouping
conventional_commits = true

# Commit parsing regex - matches conventional commits
# format: <type>(<scope>): <subject>
commit_parsers = [
    { message = "^(?P<type>feat)(?:\\((?P<scope>[^)]+)\\))?: (?P<subject>.*)$", group = "Features" },
    { message = "^(?P<type>fix)(?:\\((?P<scope>[^)]+)\\))?: (?P<subject>.*)$", group = "Bug Fixes" },
    { message = "^(?P<type>perf)(?:\\((?P<scope>[^)]+)\\))?: (?P<subject>.*)$", group = "Performance" },
    { message = "^(?P<type>refactor)(?:\\((?P<scope>[^)]+)\\))?: (?P<subject>.*)$", group = "Refactoring" },
    { message = "^(?P<type>docs)(?:\\((?P<scope>[^)]+)\\))?: (?P<subject>.*)$", group = "Documentation" },
    { message = "^(?P<type>test)(?:\\((?P<scope>[^)]+)\\))?: (?P<subject>.*)$", group = "Tests" },
    { message = "^(?P<type>ci)(?:\\((?P<scope>[^)]+)\\))?: (?P<subject>.*)$", group = "CI/CD" },
    { message = "^(?P<type>build)(?:\\((?P<scope>[^)]+)\\))?: (?P<subject>.*)$", group = "Build" },
    { message = "^(?P<type>chore)(?:\\((?P<scope>[^)]+)\\))?: (?P<subject>.*)$", group = "Chores" },
    { message = "^(?P<type>revert)(?:\\((?P<scope>[^)]+)\\))?: (?P<subject>.*)$", group = "Reverts" },
]

# Group commits by type
group_by = "type"

# Order of groups in changelog
group_order = [
    "feat",
    "fix",
    "perf",
    "refactor",
    "docs",
    "test",
    "ci",
    "build",
    "chore",
    "revert",
]

# Map commit types to display names
[git.group_names]
feat = "✨ Features"
fix = "🐛 Bug Fixes"
perf = "⚡ Performance"
refactor = "♻️ Refactoring"
docs = "📚 Documentation"
test = "✅ Tests"
ci = "🔧 CI/CD"
build = "📦 Build"
chore = "🧹 Chores"
revert = "↩️ Reverts"

[git.commit_prepend]
# Prepend scope to commit message
scope = true

[git.commit_template]
# Template for each commit in the changelog
# {{ message }} - the commit subject
# {{ scope }} - the scope if present
# {{ id }} - the commit hash
message = "{{ message }}{% if scope %} (**{{ scope }}**){% endif %}"