# git-cliff configuration for Droidplane
# Generates release changelog from conventional (and non-conventional) commits

[changelog]
header = ""

body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} ({{ commit.id | truncate(length=7, end="") }}){% if commit.scope %} (**{{ commit.scope }}**){% endif %}
{% endfor %}
{% endfor %}
"""

footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
filter_commits = false
sort_commits = "oldest"

commit_parsers = [
    { message = "^chore\\(release\\):", skip = true },
    { message = "\\[skip ci\\]", skip = true },
    { message = "^Merge ", skip = true },
    { message = "^feat", group = "<!-- 00 -->✨ Features" },
    { message = "^fix", group = "<!-- 01 -->🐛 Bug Fixes" },
    { message = "^perf", group = "<!-- 02 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 03 -->♻️ Refactoring" },
    { message = "^docs", group = "<!-- 04 -->📚 Documentation" },
    { message = "^test", group = "<!-- 05 -->✅ Tests" },
    { message = "^ci", group = "<!-- 06 -->🔧 CI/CD" },
    { message = "^build", group = "<!-- 07 -->📦 Build" },
    { message = "^chore", group = "<!-- 08 -->🧹 Chores" },
    { message = "^revert", group = "<!-- 09 -->↩️ Reverts" },
    { message = ".*", group = "<!-- 10 -->📝 Other Changes" },
]
